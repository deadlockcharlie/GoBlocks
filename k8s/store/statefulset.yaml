apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blockstore
  namespace: goblocks
spec:
  serviceName: blockstore-headless
  replicas: 3
  selector:
    matchLabels:
      app: blockstore
  template:
    metadata:
      labels:
        app: blockstore
    spec:
      containers:
      - name: blockstore
        image: goblocks:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: ZKAddress
          valueFrom: 
            configMapKeyRef:
              name: zookeeperconfig
              key: ZKAddress
        - name: ZKPort
          valueFrom: 
            configMapKeyRef: 
              name: zookeeperconfig
              key: ZKPort
        - name: ReplicaName
          valueFrom: 
            fieldRef:
              fieldPath: metadata.name
        - name: ReplicaAddress
          value: "$(ReplicaName).blockstore-headless.goblocks.svc.cluster.local"
        - name: ReplicationFactor
          value: "3"
        resources:
          requests: 
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
