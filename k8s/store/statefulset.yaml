apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blockstore
  namespace: goblocks
spec:
  serviceName: blockstore-headless
  replicas: 3
  selector:
    matchLabels:
      app: blockstore
  template:
    metadata:
      labels:
        app: blockstore
    spec:
      containers:
      - name: blockstore
        image: blackjackap/goblocks:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 6000
          name: http
        env:
        - name: ZKAddress
          valueFrom: 
            configMapKeyRef:
              name: zookeeperconfig
              key: ZKAddress
        - name: ZKPort
          valueFrom: 
            configMapKeyRef: 
              name: zookeeperconfig
              key: ZKPort
        - name: ReplicaName
          valueFrom: 
            fieldRef:
              fieldPath: metadata.name
        - name: ReplicaAddress
          value: "$(ReplicaName).blockstore-headless.goblocks.svc.cluster.local"
        - name: ReplicationFactor
          value: "3"
        # OpenTelemetry configuration
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-collector.goblocks.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_SERVICE_NAME
          value: "goblocks"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.version=1.0,deployment.environment=dev"
        resources:
          requests: 
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
